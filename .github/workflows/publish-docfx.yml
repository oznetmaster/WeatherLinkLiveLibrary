name: Publish DocFX Site

on:
  push:
	branches:
	  - dotnet-10-upgrade
	paths:
	  - 'WeatherLink Live Library/**'
	  - 'WeattherLinkLive Test/**'
	  - 'docfx/**'
	  - 'docs/**'
	  - 'WeatherLink Live Library.csproj'
	  - '.github/workflows/publish-docfx.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
	runs-on: windows-latest

	steps:
	  - name: Checkout
		uses: actions/checkout@v4

		- name: Setup .NET
		uses: actions/setup-dotnet@v4
		with:
		  dotnet-version: |
			10.0.x

		- name: Setup Pages
		uses: actions/configure-pages@v5

		- name: Restore local tools
		run: dotnet tool restore

		- name: Build Release libraries
		run: dotnet build .\WeatherLink Live Library.sln -c Release --no-restore

		- name: Generate DocFX metadata
		run: dotnet tool run docfx metadata .\docfx\docfx.json --logLevel Error

		- name: Build DocFX site
		run: dotnet tool run docfx build .\docfx\docfx.json --output .\docfx-site

		- name: Upload Pages artifact
		uses: actions/upload-pages-artifact@v3
		with:
		  path: .\docfx-site

  deploy-docs:
	environment:
	  name: github-pages
	  url: ${{ steps.deployment.outputs.page_url }}
	runs-on: ubuntu-latest
	needs: build-docs

	steps:
	  - name: Deploy to GitHub Pages
		id: deployment
		uses: actions/deploy-pages@v4
