name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version or tag to publish, for example 1.2.3 or v1.2.3
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pack-and-publish:
    runs-on: windows-latest
    env:
      PROJECT_PATH: .\WeatherLink Live Library\WeatherLink Live Library.csproj
      ARTIFACT_DIR: ${{ github.workspace }}\artifacts
      DOCFX_CONFIG: .\WeatherLink Live Library\docfx\docfx.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $rawVersion = switch ('${{ github.event_name }}') {
              'workflow_dispatch' { '${{ inputs.version }}'; break }
              'push' { '${{ github.ref_name }}'; break }
              default { '' }
          }
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
              throw 'No release tag or manual version was provided.'
          }

          $packageVersion = $rawVersion.Trim()
          if ($packageVersion.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
              $packageVersion = $packageVersion.Substring(1)
          }

          if ($packageVersion -match '^(\d+\.\d+\.\d+)([A-Za-z][0-9A-Za-z\.-]*)$') {
              $packageVersion = "$($Matches[1])-$($Matches[2])"
          }

          if ($packageVersion -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z\.-]+)?$') {
              throw "Version '$packageVersion' is not a supported NuGet semantic version."
          }

          "raw_version=$rawVersion" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ".\WeatherLink Live Library.sln"

      - name: Build Release
        run: dotnet build ".\WeatherLink Live Library.sln" -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Pack library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.ARTIFACT_DIR }}" -Force | Out-Null
          dotnet pack "${{ env.PROJECT_PATH }}" -c Release --no-build -o "${{ env.ARTIFACT_DIR }}" /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.version.outputs.package_version }} /p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Push NuGet package
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "${{ env.ARTIFACT_DIR }}" -Filter '*.nupkg' | Where-Object { $_.Name -notlike '*.symbols.nupkg' }
          if (-not $packages) {
              throw 'No NuGet package was produced.'
          }

          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      - name: Push symbol package
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "${{ env.ARTIFACT_DIR }}" -Filter '*.snupkg'
          if (-not $packages) {
              Write-Host 'No symbol package was produced.'
              exit 0
          }

          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore local tools
        run: dotnet tool restore

      - name: Generate DocFX metadata
        run: dotnet tool run docfx metadata "${{ env.DOCFX_CONFIG }}" --logLevel Error

      - name: Build DocFX site
        shell: pwsh
        run: |
          $outDir = Join-Path ${{ github.workspace }} "docfx-site"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          dotnet tool run docfx build "${{ env.DOCFX_CONFIG }}" --output $outDir
          Write-Host "Output directory contents:"
          Get-ChildItem $outDir | Select-Object Name

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}\docfx-site

      - name: Create GitHub release from tag
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.raw_version }}
          name: ${{ steps.version.outputs.raw_version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.package_version, '-') }}
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: pack-and-publish

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
