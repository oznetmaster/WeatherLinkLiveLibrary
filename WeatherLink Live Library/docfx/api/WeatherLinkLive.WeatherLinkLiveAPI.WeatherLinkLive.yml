  summary: "\nInitializes a new instance of the <xref href=\"WeatherLinkLive.WeatherLinkLiveAPI.WeatherLinkLive\" data-throw-if-not-resolved=\"false\"></xref> class.\nInitializes a new instance from an IP address string.\n"
  syntax:
    content: public WeatherLinkLive(string iPAddress, int refreshIntervalSeconds = 30, int forceRefreshIntervalSeconds = 60, bool celciusTemperature = false, bool metricRain = false, bool metricWind = false, bool metricBarometer = false)
    parameters:
    - id: iPAddress
      type: System.String
      description: The WeatherLink Live device IPv4 address.
    - id: refreshIntervalSeconds
      type: System.Int32
      description: Minimum seconds between refreshes. Must be greater than or equal to10.
    - id: forceRefreshIntervalSeconds
      type: System.Int32
      description: Maximum allowed age of cached data before access throws.
    - id: celciusTemperature
      type: System.Boolean
      description: True to return temperatures in Celsius instead of Fahrenheit.
    - id: metricRain
      type: System.Boolean
      description: True to return rainfall in metric units.
    - id: metricWind
      type: System.Boolean
      description: True to return wind speed in metric units.
    - id: metricBarometer
      type: System.Boolean
      description: True to return barometer in metric units.
